name: Medicine V2 production
on:
  push:
    branches: [main]
    paths:
      - 'remotion/src/medicine/**'
      - 'remotion/public/medicine/**'
      - 'remotion/scripts/medicine-*'
      - '.github/workflows/medicine-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: "${{ hashFiles('remotion/src/medicine/alignment.json') == '' }}"
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - if: "${{ hashFiles('remotion/src/medicine/alignment.json') == '' }}"
        run: pip install stable-ts==2.19.1
      - run: pip install fonttools pillow
      - name: Align approved narration and check fonts
        run: python scripts/medicine-align.py
      - uses: actions/upload-artifact@v4
        with:
          name: medicine-alignment
          path: |
            remotion/src/medicine/timing.json
            remotion/out/medicine/alignment.json
            remotion/out/medicine/preflight.json
          retention-days: 14

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: remotion/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec remotion browser ensure
      - name: Compile composition
        run: pnpm exec tsc --noEmit
      - name: Render every scene and transition for QA
        run: node scripts/medicine-frames.mjs
      - run: python scripts/medicine-contact.py
      - uses: actions/upload-artifact@v4
        with:
          name: medicine-preview
          path: remotion/out/medicine
          retention-days: 14

      - name: Render approved MP4 on GitHub
        run: pnpm exec remotion render src/index.ts MedicineSafetyV2 out/medicine/ASF-20261011-001.mp4 --codec=h264 --audio-codec=aac --pixel-format=yuv420p --crf=18 --concurrency=2
      - name: Decode entire MP4 and extract final frames
        run: python scripts/medicine-verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: ASF-20261011-001-MP4
          path: |
            remotion/out/medicine/ASF-20261011-001.mp4
            remotion/out/medicine/metadata.json
            remotion/out/medicine/qa-report.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ASF-20261011-001-QA
          path: |
            remotion/out/medicine/frames-final
            remotion/out/medicine/contact-sheet.jpg
            remotion/out/medicine/safe-zone-check.jpg
            remotion/out/medicine/preflight.json
            remotion/out/medicine/qa-samples.json
            remotion/src/medicine/timing.json
            remotion/src/medicine/visual-review.json
          if-no-files-found: error
          retention-days: 14
