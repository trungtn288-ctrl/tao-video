name: Registry core tests
on:
  push:
    paths: ['registry/**', 'package.json', '.github/workflows/registry-test.yml']
  pull_request:
    paths: ['registry/**', 'package.json', '.github/workflows/registry-test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
