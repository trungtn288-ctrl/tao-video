name: Render Remotion video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: Composition ID (video or scene)
        required: true
        type: string
        default: MealWalkKnowledgeR3

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: remotion/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core
      - name: Prepare browser
        run: pnpm exec remotion browser ensure
      - name: Render MP4 on GitHub
        env:
          COMPOSITION: ${{ inputs.composition }}
        run: pnpm exec remotion render src/index.ts "$COMPOSITION" out/video.mp4 --codec=h264 --concurrency=2
      - name: Downloadable video
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video-${{ github.run_number }}
          path: remotion/out/video.mp4
          if-no-files-found: error
          retention-days: 14
